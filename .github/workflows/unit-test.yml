name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Set node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --filter mentis --filter @mentis/engine --frozen-lockfile

      - name: Build
        run: pnpm run build --filter mentis

      - name: Typecheck
        run: pnpm run typecheck --filter mentis

      - name: Test
        run: pnpm run test --filter mentis

      # @mentis/engine is private and never built, but it still needs checking or it
      # rots unnoticed — nothing else in CI touches it.
      - name: Typecheck engine
        run: pnpm run typecheck --filter @mentis/engine

      - name: Test engine
        run: pnpm run test --filter @mentis/engine
